<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Donate · Livestream</title>
<link rel="stylesheet" href="overlay.css?v=8">
<link rel="stylesheet" href="overlay-fx.css?v=24">
<link rel="stylesheet" href="overlay-layout.css?v=1">
<link rel="stylesheet" href="donate-card.css?v=30">
<link rel="stylesheet" href="music-player.css?v=36">
<link rel="stylesheet" href="roulette-overlay.css?v=2">
<body>
<section id="previewTools" class="tools" hidden>
  <span class="eyebrow">BẢN XEM THỬ LIVESTREAM</span>
  <h1>Lời nhắn từ người xem</h1>
  <p>Chọn mốc để xem đúng hiệu ứng; bản thử không sử dụng giao dịch trong hàng đợi.</p>
  <div class="preview-tiers" aria-label="Chọn mốc hiệu ứng">
    <button type="button" data-preview-tier="1">Thử 10.000đ</button>
    <button type="button" data-preview-tier="2">Thử rồng 50.000đ</button>
    <button type="button" data-preview-tier="3">Thử tiên nữ 200.000đ</button>
  </div>
  <button id="previewPlay" type="button">Phát thử hình ảnh & giọng đọc</button>
</section>
<div id="obsFrame">
<section id="musicCard" class="music-card" hidden><header><strong id="musicTitle">Đang phát nhạc</strong><span id="musicSender"></span></header>
<div class="music-progress" role="progressbar" aria-label="Tiến độ bài nhạc" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="musicProgressFill"></div></div>
<div class="music-clock"><span id="musicTime">0:00 / 0:00</span><span id="musicPercent">0%</span></div>
<div id="musicNext" class="music-next" hidden><small>SẮP PHÁT</small><strong id="musicNextTitle"></strong></div>
<div id="musicIdle" class="music-idle" hidden><strong>♫ ORDER NHẠC</strong><p id="musicIdleMessage"></p></div>
<button id="musicEnable" class="music-enable" type="button" hidden>Bật phát nhạc</button>
<div id="musicVideo" class="music-video" aria-hidden="true"></div></section>
<div id="tierIntro" class="tier-intro" hidden aria-hidden="true">
  <canvas id="fxCanvas" class="intro-fx"></canvas>
  <div class="intro-title"><span id="introKicker"></span><strong id="introTitle"></strong></div>
</div>
<article id="stage" class="stage donate-card" aria-live="polite">
  <div class="card-shine" aria-hidden="true"></div>
  <div class="card-main">
    <div class="donation-heading">
      <div class="donor">
        <span id="avatar" class="avatar">A</span>
        <div class="donor-copy"><h2><span id="donorName">Nguyễn Văn An</span> <small id="donorLevel" class="donor-level">Lv0</small></h2></div>
      </div>
      <div class="amount-row"><span id="donationAmount" class="donation-amount">10.000</span><span class="currency">đ</span></div>
    </div>
    <blockquote><p id="donorMessage">Chúc bạn có một buổi livestream thật vui!</p></blockquote>
    <img id="donorSkin" class="donor-skin" alt="" hidden>
    <div id="speechState" class="speech-state"><i></i><i></i><i></i><span id="speechLabel">LỜI NHẮN</span></div>
  </div>
  <div class="progress-track"><div id="progress" class="progress"></div></div>
</article>
</div>
<aside id="audioTools" class="audio-tools" hidden><p id="notice" role="status"></p><button id="enableAudio" type="button">Bật tiếng / nghe thử</button></aside>
<section id="rouletteOverlay" class="roulette-overlay" hidden>
  <div class="roulette-board">
    <div class="roulette-dial"><canvas width="640" height="420" aria-hidden="true"></canvas></div>
    <div class="roulette-copy">
      <p class="roulette-caption">VÒNG QUAY DONATE</p>
      <h2></h2>
      <ol></ol>
      <p class="roulette-result" role="status"></p>
    </div>
  </div>
</section>
<script src="speech-runtime.js?v=5"></script><script src="overlay-layout.js?v=29"></script><script src="roulette-overlay.js?v=4"></script><script src="overlay.js?v=44"></script><script src="cinematic-fx.js?v=26"></script><script src="cinematic-config.js?v=26"></script><script src="intro-fx.js?v=24"></script><script src="sfx.js?v=27"></script>
<script src="music-progress.js?v=34"></script><script src="music-layout.js?v=36"></script><script src="music-overlay.js?v=36"></script>
</body>
</html>
